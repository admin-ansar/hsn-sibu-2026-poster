<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Hari Sukan Negara 2026 — Sibu, Sarawak</title>
  <desc id="desc">Poster potret moden dalam warna merah, kuning dan hitam Sarawak, menampilkan atlet serta identiti sungai dan angsa Sibu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.5" stop-color="#060606"/>
      <stop offset="1" stop-color="#1f0b0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3333"/>
      <stop offset="1" stop-color="#b80013"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff177"/>
      <stop offset="0.45" stop-color="#ffd21c"/>
      <stop offset="1" stop-color="#f4a900"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201315" stop-opacity="0"/>
      <stop offset="1" stop-color="#7f0011" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="motif" width="92" height="92" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 46H92M46 0V92" stroke="#ffd21c" stroke-width="2" opacity="0.1"/>
      <path d="M18 18L46 4 74 18 88 46 74 74 46 88 18 74 4 46Z" fill="none" stroke="#ffd21c" stroke-width="3" opacity="0.11"/>
      <circle cx="46" cy="46" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1080" height="1350" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#motif)"/>

    <!-- Dynamic Sarawak-colour bands -->
    <path d="M-190 130L1250 -50 1250 180-190 360Z" fill="url(#red)" opacity="0.98"/>
    <path d="M-130 335L1210 90 1210 132-130 382Z" fill="url(#gold)"/>
    <path d="M820 -120L1160 -40 910 750 685 715Z" fill="#d0081b" opacity="0.78"/>
    <path d="M906 -120L1015 -95 784 707 716 706Z" fill="#ffd21c" opacity="0.94"/>
    <path d="M-250 1080L1110 790 1165 1040-195 1308Z" fill="#d0081b" opacity="0.96"/>
    <path d="M-230 1022L1110 740 1123 797-217 1081Z" fill="#ffd21c"/>

    <!-- Header label -->
    <g transform="translate(70 72)">
      <rect width="360" height="58" rx="29" fill="#0b0b0b" opacity="0.94"/>
      <circle cx="31" cy="29" r="12" fill="#ffd21c"/>
      <path d="M25 29l5 5 9-12" fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="38" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">SIBU • SARAWAK</text>
    </g>

    <!-- Main title -->
    <g transform="translate(65 215)" filter="url(#shadow)">
      <text x="0" y="0" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="900" letter-spacing="1">HARI SUKAN</text>
      <text x="0" y="88" fill="#ffd21c" font-family="Arial, Helvetica, sans-serif" font-size="101" font-weight="900" letter-spacing="-2">NEGARA</text>
      <rect x="3" y="112" width="550" height="8" rx="4" fill="#fff" opacity="0.95"/>
      <text x="0" y="190" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="8">MALAYSIA AKTIF</text>
    </g>

    <!-- Giant year -->
    <g transform="translate(600 286) rotate(-4)" filter="url(#shadow)">
      <text x="0" y="0" fill="#ffd21c" stroke="#0a0a0a" stroke-width="8" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="151" font-style="italic" font-weight="900" letter-spacing="-10">2026</text>
    </g>

    <!-- Energy glow behind athletes -->
    <ellipse cx="536" cy="736" rx="360" ry="285" fill="#f31529" opacity="0.2" filter="url(#softGlow)"/>
    <circle cx="535" cy="690" r="248" fill="none" stroke="#ffd21c" stroke-width="4" opacity="0.22"/>
    <circle cx="535" cy="690" r="285" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 15" opacity="0.18"/>

    <!-- Left cyclist silhouette -->
    <g transform="translate(170 684) rotate(-7)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
      <circle cx="0" cy="126" r="67" stroke-width="13"/>
      <circle cx="215" cy="126" r="67" stroke-width="13"/>
      <path d="M0 126l75-88 55 88H0l42-64h112l61 64M75 38l-14-32M54 5h39" stroke-width="15"/>
      <circle cx="113" cy="-22" r="23" fill="#ffffff" stroke="none"/>
      <path d="M97 2L62 47M100 2l59 20 36 4M62 46l68 80M159 22l-29 104" stroke-width="22"/>
      <path d="M198 24h28" stroke-width="12"/>
    </g>

    <!-- Central runner -->
    <g transform="translate(465 485) rotate(7)" fill="#ffffff" filter="url(#shadow)">
      <circle cx="75" cy="38" r="38"/>
      <path d="M48 89c10-24 34-37 58-28l75 28c18 7 26 24 20 40-7 19-26 24-43 17l-44-18 29 93-56 18-34-96-35 57c-8 15-27 20-42 11-15-9-19-27-10-42l58-84c6-9 14-14 24-16Z"/>
      <path d="M87 224l57-17 83 91c13 15 12 37-3 49-15 13-36 11-49-3l-72-78-33 93 82 93c13 15 12 37-3 50-15 12-37 11-49-4L5 394c-10-12-13-27-8-42l49-106c7-15 23-24 41-22Z"/>
      <path d="M177 91l77-62c14-11 34-9 45 4 11 14 9 34-4 45l-94 76Z"/>
    </g>

    <!-- Right badminton player -->
    <g transform="translate(814 581) rotate(5)" fill="#ffd21c" filter="url(#shadow)">
      <circle cx="1" cy="28" r="32"/>
      <path d="M-25 73c8-25 34-38 58-29 16 6 27 20 29 36l11 92-52 4-8-64-29 57-43-22Z"/>
      <path d="M48 65l87-74c13-11 32-9 42 3 10 13 9 31-4 42L68 126Z"/>
      <path d="M20 170l55-5 30 116c4 17-6 34-23 39-17 4-34-6-38-23l-20-78-43 63 58 88c10 15 6 35-9 45-15 9-34 5-44-10l-73-110c-7-11-7-25 0-36Z"/>
      <!-- Racquet -->
      <g transform="translate(154 -24) rotate(-15)" fill="none" stroke="#ffd21c" stroke-width="9">
        <ellipse cx="38" cy="-64" rx="42" ry="61"/>
        <path d="M16-111l48 94M2-76l72 24M3-52l66 22M18-12l-7 19M38-123L14-10M58-112L28-5M71-92L42-16" stroke-width="3" opacity="0.8"/>
        <path d="M19-10L-20 88" stroke-width="12"/>
      </g>
    </g>

    <!-- Motion streaks -->
    <g fill="none" stroke-linecap="round">
      <path d="M80 607h240" stroke="#ffd21c" stroke-width="11" opacity="0.8"/>
      <path d="M40 641h210" stroke="#ffffff" stroke-width="5" opacity="0.62"/>
      <path d="M805 901h220" stroke="#ffd21c" stroke-width="9" opacity="0.82"/>
      <path d="M842 932h205" stroke="#ffffff" stroke-width="5" opacity="0.52"/>
    </g>

    <!-- Sibu river + skyline -->
    <g transform="translate(0 935)">
      <rect y="0" width="1080" height="415" fill="url(#river)"/>
      <path d="M0 212C142 170 251 258 394 220c149-40 258-8 368 29 110 36 211 27 318-5v171H0Z" fill="#090909" opacity="0.97"/>
      <path d="M0 221c153-43 254 44 395 7 151-40 257-6 369 31 104 34 208 24 316-9" fill="none" stroke="#ffd21c" stroke-width="5" opacity="0.8"/>
      <!-- Simplified Sibu riverfront geometry -->
      <g fill="#181818" stroke="#ffd21c" stroke-width="3" opacity="0.92">
        <path d="M69 203v-83h32v83M53 120h64l-9-14H62Z"/>
        <path d="M145 207v-50h84v50M158 157v-39h16v39M199 157v-67h16v67"/>
        <path d="M846 230v-114h82v114M836 116h102l-51-42Z"/>
        <path d="M950 230v-67h74v67M960 163v-30h54v30"/>
      </g>
      <!-- Swan symbol, Sibu -->
      <g transform="translate(568 210)" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
        <path d="M-169 71c55-54 127-69 202-39-32-32-26-75-5-113 18-31 52-57 90-65-34 21-51 55-48 88 4 39 39 57 73 70-18 1-36 8-50 19 37 2 75 17 103 43-80-18-159-17-236 18-47 21-94 20-129-21Z"/>
        <path d="M119-146c31 5 55 20 69 41-25-5-47 0-64 13"/>
      </g>
    </g>

    <!-- Footer content panel -->
    <g transform="translate(70 1095)">
      <rect width="940" height="170" rx="30" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
      <rect x="0" y="0" width="17" height="170" rx="8" fill="#ffd21c"/>
      <text x="55" y="64" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" letter-spacing="1">BERSAMA • AKTIF • SIHAT</text>
      <text x="55" y="111" fill="#ffd21c" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="4">SEMANGAT SUKAN, SEMANGAT KITA</text>
      <text x="55" y="145" fill="#ffffff" opacity="0.62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="2">SIBU  /  SARAWAK  /  2026</text>
    </g>

    <!-- Border -->
    <rect x="18" y="18" width="1044" height="1314" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.16"/>
    <path d="M18 180V42a24 24 0 0 1 24-24h145" fill="none" stroke="#ffd21c" stroke-width="6"/>
    <path d="M1062 1170v138a24 24 0 0 1-24 24H893" fill="none" stroke="#ffd21c" stroke-width="6"/>
  </g>
</svg>
